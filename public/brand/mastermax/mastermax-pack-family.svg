<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
  <title id="title">Temporary Mastermax orange container family visual</title>
  <desc id="desc">A restrained vector representation of orange rectangular lubricant containers and a pail. It is a temporary visual pending original product packshots.</desc>
  <defs>
    <linearGradient id="orange" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f1913d"/>
      <stop offset="0.46" stop-color="#dd6724"/>
      <stop offset="1" stop-color="#9f3512"/>
    </linearGradient>
    <linearGradient id="orangeDark" x1="0" x2="1">
      <stop offset="0" stop-color="#8c2b0e"/>
      <stop offset="0.5" stop-color="#c54b18"/>
      <stop offset="1" stop-color="#742009"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#171b1e"/>
      <stop offset="0.5" stop-color="#3c4348"/>
      <stop offset="1" stop-color="#111416"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
